services:
  postgres:
    image: postgres:16-alpine
    container_name: travel_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     travel
      POSTGRES_PASSWORD: travel_secret
      POSTGRES_DB:       travel_db
    ports:
      - "5432:5432"
    volumes:
      - travel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  travel_db_data:
    driver: local
